# --- Database (H2 in-memory) --------------------------------------------------
# No setup needed — database is created automatically on startup and wiped on shutdown.
# TODO: swap back to PostgreSQL when ready for real persistence (see commented block below)
spring.datasource.url=jdbc:h2:mem:travelmap;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# --- JPA/Hibernate ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# --- PostgreSQL (uncomment when ready, remove H2 block above) -----------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/travelmap
# spring.datasource.username=your_username
# spring.datasource.password=your_password
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# --- Spring Boot --------------------------------------------------------------
spring.application.name=travelmap
# --- Server port --------------------------------------------------------------
server.port=8080
# --- Media uploads (FR7) ------------------------------------------------------
# Where uploaded files are stored on disk. Path is relative to where the
# Spring Boot process runs from (project root when using `mvn spring-boot:run`
# from the backend directory).
travelmap.media.upload-dir=uploads

# Multipart limits — Spring's built-in MultipartResolver enforces these
# before the file ever reaches MediaController. Requests exceeding the
# limit are rejected with HTTP 413 Payload Too Large by Spring itself.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
